name: Deploy PantryOS to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pantryos-production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" <<'REMOTE_COMMANDS'
          set -eu

          cd /home/ubuntu/PantryOS
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          docker compose -f docker-compose.production.yml build
          docker compose -f docker-compose.production.yml run --rm backend alembic upgrade head
          docker compose -f docker-compose.production.yml up -d --force-recreate

          curl --fail --silent --show-error http://localhost/api/health
          REMOTE_COMMANDS
